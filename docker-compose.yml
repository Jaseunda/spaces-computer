version: '3.8'

services:
  spaces-computer:
    image: ghcr.io/jaseunda/spaces-computer:latest
    container_name: spaces-computer-standalone
    restart: unless-stopped
    ports:
      - "7070:7070"
      - "6080:6080"
    environment:
      - DISPLAY=:1
      - COMPUTER_CONTROL_TOKEN=spaces-secret-token
    volumes:
      - ~/.spaces/computer-home:/home/computer
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    shm_size: '512m'
